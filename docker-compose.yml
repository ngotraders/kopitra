services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kopitra-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "KopitraPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P KopitraPassword123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kopitra-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: kopitra-azurite
    ports:
      - "10000:10000"  # Blob Storage
      - "10001:10001"  # Queue Storage
      - "10002:10002"  # Table Storage
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:devstorekey1
    volumes:
      - azurite_data:/data
    networks:
      - kopitra-network

  backend:
    platform: linux/amd64
    build:
      context: ./functions
      dockerfile: Dockerfile
    container_name: kopitra-backend
    ports:
      - "7071:7071"
    environment:
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - ASPNETCORE_URLS=http://+:7071
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=devstorekey1;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - ConnectionStrings__KopitraDbConnection=Server=sqlserver,1433;Database=kopitra_dev;User Id=sa;Password=KopitraPassword123!;TrustServerCertificate=True;
      - KopitraDbConnection=Server=sqlserver,1433;Database=kopitra_dev;User Id=sa;Password=KopitraPassword123!;TrustServerCertificate=True;
      - Jwt__SecretKey=KopitraDevJwtSecret2026!
      - Jwt__Issuer=kopitra-api
      - Jwt__Audience=kopitra-clients
    depends_on:
      - sqlserver
      - azurite
    networks:
      - kopitra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kopitra-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:7071
    depends_on:
      - backend
    networks:
      - kopitra-network

volumes:
  sqlserver_data:
    driver: local
  azurite_data:
    driver: local

networks:
  kopitra-network:
    driver: bridge
